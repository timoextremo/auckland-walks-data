name: Inspect AKL Paths page
on:
  push:
    paths:
      - '.github/workflows/inspect-aklpaths-page.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect route pages
        run: |
          python - <<'PY'
          import requests,re,json,html
          from pathlib import Path
          urls=[
            'https://www.aucklandcouncil.govt.nz/en/parks-recreation/get-outdoors/aklpaths/path-detail/305.html',
            'https://www.aucklandcouncil.govt.nz/en/parks-recreation/get-outdoors/aklpaths/path-detail/308.html',
            'https://www.aucklandcouncil.govt.nz/en/parks-recreation/get-outdoors/aklpaths/path-detail/133.html'
          ]
          out=[]
          for u in urls:
            r=requests.get(u,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
            out.append(f'URL {u} STATUS {r.status_code} LEN {len(r.text)}')
            text=r.text
            # record external script URLs
            scripts=re.findall(r'<script[^>]+src=[\"\']([^\"\']+)', text, flags=re.I)
            out.append('SCRIPTS '+json.dumps(scripts))
            # snippets around map/coordinate/lat/lng/path keywords
            low=text.lower()
            for kw in ['show path map','latitude','longitude','coordinates','polyline','geometry','mapdata','map data','pathmap','route']:
              starts=[m.start() for m in re.finditer(re.escape(kw),low)]
              for s in starts[:10]:
                sn=text[max(0,s-600):min(len(text),s+1200)].replace('\n',' ')
                out.append(f'KW {kw}: '+sn)
            out.append('\n---\n')
          Path('source-data').mkdir(exist_ok=True)
          Path('source-data/aklpaths-page-inspection.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit result and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-data/aklpaths-page-inspection.txt
          git rm .github/workflows/inspect-aklpaths-page.yml
          git commit -m 'Inspect AKL Paths route page map data'
          git push