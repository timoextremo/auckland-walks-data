name: Fetch AucklandPaths config
on:
  push:
    paths:
      - '.github/workflows/fetch-aucklandpaths-config.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch configs
        run: |
          python - <<'PY'
          import requests,json,re,urllib.parse
          from pathlib import Path
          base='https://mapspublic.aklc.govt.nz/bizapps/AucklandPaths/'
          s=requests.Session(); h={'User-Agent':'Mozilla/5.0'}
          out=[]
          for f in ['config.json','manifest.json']:
            u=base+f; r=s.get(u,headers=h,timeout=30)
            out.append(f'=== {u} {r.status_code} len={len(r.text)} ===\n{r.text[:200000]}')
            if f=='config.json' and r.ok:
              try:
                j=r.json()
                # recursively gather URLs and config file paths
                def walk(x,path=''):
                  if isinstance(x,dict):
                    for k,v in x.items():
                      if isinstance(v,str) and ('url' in k.lower() or 'uri' in k.lower() or 'config' in k.lower() or any(q in v.lower() for q in ['mapserver','featureserver','rest/services'])):
                        out.append(f'VAL {path}/{k}={v}')
                      walk(v,path+'/'+str(k))
                  elif isinstance(x,list):
                    for i,v in enumerate(x): walk(v,path+f'/{i}')
                walk(j)
                # fetch any local widget config jsons
                cfgs=set(re.findall(r'"(configs/[^"]+\.json)"',r.text,re.I))
                for c in sorted(cfgs):
                  rr=s.get(urllib.parse.urljoin(base,c),headers=h,timeout=20)
                  out.append(f'=== CFG {c} {rr.status_code} len={len(rr.text)} ===\n{rr.text[:100000]}')
              except Exception as e: out.append('JSONERR '+repr(e))
          Path('source-data').mkdir(exist_ok=True)
          Path('source-data/aucklandpaths-config.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit result and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-data/aucklandpaths-config.txt
          git rm .github/workflows/fetch-aucklandpaths-config.yml
          git commit -m 'Fetch AucklandPaths Web AppBuilder configuration'
          git push