name: Package full Council track layer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: full-auckland-council-track-layer
          path: source-data/auckland-council/TrackTrailCycleway/layer-0-TrackTrailCycleway.geojson
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/package-full-council-layer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-shot full Council layer packager' || exit 0
          git push
