name: Access triage - 24 track official evidence pilot
on:
  pull_request:
    paths:
      - '.github/workflows/access-triage-zonepilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: "zonepilot-1"
            rows: "1248,1272,1288,1289"
          - name: "zonepilot-2"
            rows: "1298,1032,1103,1117"
          - name: "zonepilot-3"
            rows: "1125,1145,1161,858"
          - name: "zonepilot-4"
            rows: "869,879,886,893"
          - name: "zonepilot-5"
            rows: "915,917,920,921"
          - name: "zonepilot-6"
            rows: "922,875,892,896"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only GIS libraries
        run: python -m pip install --quiet "shapely>=2.0" "pyproj>=3.5" "requests>=2.31"
      - name: Exact KML geometries and WGS84 extent
        run: python scripts/historic_kml_metadata.py --rows "${{ matrix.rows }}"
      - name: WAMS exact-centreline legal access polygon classes including easements
        run: python scripts/land_access_herenga_pilot.py --rows "${{ matrix.rows }}"
      - name: Official regional walking and shared-use track GIS
        run: python scripts/oac_tracks_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: Upload evidence (no sheet writes, no legal access inference)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "access-triage-${{ matrix.name }}"
          path: |
            wams-batch-*.json
            oac_match_*.json
          if-no-files-found: warn
