name: LINZ primary parcel pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/land-access-pilot.yml'
      - 'map-data/auckland-walks/clusters/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intersect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1023-1029"
            rows: "1023,1024,1025,1026,1027,1028,1029"
          - name: "1030-1036"
            rows: "1030,1031,1032,1033,1034,1035,1036"
          - name: "1037-1043"
            rows: "1037,1038,1039,1040,1041,1042,1043"
          - name: "1044-1050"
            rows: "1044,1045,1046,1047,1048,1049,1050"
          - name: "1051-1057"
            rows: "1051,1052,1053,1054,1055,1056,1057"
          - name: "1058-1064"
            rows: "1058,1059,1060,1061,1062,1063,1064"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect first 21 route geometries with LINZ public primary parcels
        run: python scripts/land_access_primary_parcels.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "primary-parcel-${{ matrix.name }}"
          path: primary_parcel_pilot.json
          if-no-files-found: ignore
