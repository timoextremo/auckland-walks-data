name: LINZ primary parcel pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/land-access-pilot.yml'
      - 'map-data/auckland-walks/clusters/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intersect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1362-1368"
            rows: "1362,1363,1364,1365,1366,1367,1368"
          - name: "1369-1375"
            rows: "1369,1370,1371,1372,1373,1374,1375"
          - name: "1376-1382"
            rows: "1376,1377,1378,1379,1380,1381,1382"
          - name: "1383-1389"
            rows: "1383,1384,1385,1386,1387,1388,1389"
          - name: "1390-1396"
            rows: "1390,1391,1392,1393,1394,1395,1396"
          - name: "1397-1403"
            rows: "1397,1398,1399,1400,1401,1402,1403"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect first 21 route geometries with LINZ public primary parcels
        run: python scripts/land_access_primary_parcels.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "primary-parcel-${{ matrix.name }}"
          path: primary_parcel_pilot.json
          if-no-files-found: ignore
