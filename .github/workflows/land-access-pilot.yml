name: LINZ primary parcel pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/land-access-pilot.yml'
      - 'map-data/auckland-walks/clusters/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intersect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1233-1239"
            rows: "1233,1234,1235,1236,1237,1238,1239"
          - name: "1240-1246"
            rows: "1240,1241,1242,1243,1244,1245,1246"
          - name: "1247-1253"
            rows: "1247,1248,1249,1250,1251,1252,1253"
          - name: "1254-1260"
            rows: "1254,1255,1256,1257,1258,1259,1260"
          - name: "1261-1267"
            rows: "1261,1262,1263,1264,1265,1266,1267"
          - name: "1268-1274"
            rows: "1268,1269,1270,1271,1272,1273,1274"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect first 21 route geometries with LINZ public primary parcels
        run: python scripts/land_access_primary_parcels.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "primary-parcel-${{ matrix.name }}"
          path: primary_parcel_pilot.json
          if-no-files-found: ignore
