name: LINZ primary parcel pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/land-access-pilot.yml'
      - 'map-data/auckland-walks/clusters/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intersect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "938-944"
            rows: "938,939,940,941,942,943,944"
          - name: "945-951"
            rows: "945,946,947,948,949,950,951"
          - name: "952-958"
            rows: "952,953,954,955,956,957,958"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect first 21 route geometries with LINZ public primary parcels
        run: python scripts/land_access_primary_parcels.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "primary-parcel-${{ matrix.name }}"
          path: primary_parcel_pilot.json
          if-no-files-found: ignore
