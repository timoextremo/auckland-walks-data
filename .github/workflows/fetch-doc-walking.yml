name: Fetch DOC walking route geometry
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download DOC Walking and Tramping Experiences
        run: |
          python - <<'PY'
          import json,pathlib,urllib.parse,urllib.request
          base='https://services1.arcgis.com/3JjYDyG3oajxU6HO/arcgis/rest/services/DOC_Walking_Experiences/FeatureServer/1/query'
          out=pathlib.Path('source-data/doc'); out.mkdir(parents=True,exist_ok=True)
          features=[]; offset=0; batch=2000
          while True:
              params={'where':'1=1','outFields':'*','returnGeometry':'true','outSR':'4326','f':'geojson','resultOffset':offset,'resultRecordCount':batch}
              url=base+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=90) as r: data=json.loads(r.read())
              fs=data.get('features',[]); features.extend(fs)
              print('offset',offset,'got',len(fs))
              if len(fs)<batch: break
              offset+=len(fs)
          fc={'type':'FeatureCollection','features':features}
          (out/'doc-walking-experiences.geojson').write_text(json.dumps(fc,ensure_ascii=False),encoding='utf-8')
          # Auckland-ish bounding window in WGS84, broad enough for west coast/islands in project area.
          def coords(g):
              typ=g.get('type'); c=g.get('coordinates',[])
              if typ=='LineString': return c
              if typ=='MultiLineString': return [p for line in c for p in line]
              return []
          ak=[]
          for f in features:
              pts=coords(f.get('geometry') or {})
              if not pts: continue
              xs=[p[0] for p in pts]; ys=[p[1] for p in pts]
              # project scope generous: Kaipara/Great Barrier through south Auckland
              if max(xs)>=173.9 and min(xs)<=176.3 and max(ys)>=-37.6 and min(ys)<=-35.8:
                  ak.append(f)
          (out/'doc-walking-experiences-auckland.geojson').write_text(json.dumps({'type':'FeatureCollection','features':ak},ensure_ascii=False),encoding='utf-8')
          manifest={'source':'DOC Walking and Tramping Experiences FeatureServer/1','total_features':len(features),'auckland_window_features':len(ak)}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print(manifest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: doc-walking-auckland
          path: |
            source-data/doc/doc-walking-experiences-auckland.geojson
            source-data/doc/manifest.json
      - name: Commit source data and remove workflow
        run: |
          rm .github/workflows/fetch-doc-walking.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add DOC walking route geometry source' || exit 0
          git push
