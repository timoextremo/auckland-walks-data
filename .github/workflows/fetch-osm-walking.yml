name: Fetch Auckland OSM walking geometry

on:
  push:
    paths:
      - '.github/workflows/fetch-osm-walking.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Query Overpass for named walking geometry
        shell: bash
        run: |
          cat > query.overpass <<'EOF'
          [out:json][timeout:180];
          (
            relation["route"~"^(hiking|walking|foot)$"](-37.4,174.0,-35.8,176.0);
            way["highway"~"^(path|footway|pedestrian|steps)$"]["name"](-37.4,174.0,-35.8,176.0);
          );
          out tags geom;
          EOF
          curl -fL --retry 4 --retry-delay 10 \
            --data-urlencode 'data@query.overpass' \
            'https://overpass-api.de/api/interpreter' \
            -o osm-walking.json
          test -s osm-walking.json
      - name: Add provenance
        run: |
          cat > README.txt <<'EOF'
          OpenStreetMap walking geometry snapshot fetched from Overpass API.
          Bounding box: -37.4,174.0,-35.8,176.0.
          Includes walking/hiking/foot route relations and named path/footway/pedestrian/steps ways.
          Data © OpenStreetMap contributors, licensed under ODbL: https://www.openstreetmap.org/copyright
          EOF
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auckland-osm-walking
          path: |
            osm-walking.json
            README.txt
          retention-days: 1
