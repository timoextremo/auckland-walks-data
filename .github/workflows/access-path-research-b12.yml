name: Access B12 - next forty historical path and public-route checks
on:
  pull_request:
    paths:
      - '.github/workflows/access-path-research-b12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-walks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: "b12-01"
            rows: "1246,1367,1361,987"
          - name: "b12-02"
            rows: "1266,1411,1316,1320"
          - name: "b12-03"
            rows: "1477,909,1059,1227"
          - name: "b12-04"
            rows: "899,1253,852,994"
          - name: "b12-05"
            rows: "1292,908,1148,1016"
          - name: "b12-06"
            rows: "1097,898,1297,977"
          - name: "b12-07"
            rows: "1429,1194,1121,961"
          - name: "b12-08"
            rows: "1183,1473,986,948"
          - name: "b12-09"
            rows: "906,1219,1341,1177"
          - name: "b12-10"
            rows: "991,1025,1447,1064"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet "shapely>=2.0" "pyproj>=3.5" "requests>=2.31"
      - name: Bounded read-only modern OSM footway geometry
        run: python scripts/osm_small_bbox_check.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: Official regional walking and shared-use route geometry
        run: python scripts/oac_tracks_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: DOC published walking track geometry
        run: python scripts/doc_open_track_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "access-b12-${{ matrix.name }}"
          path: |
            local_osm_*.json
            oac_match_*.json
            doc_match_*.json
          if-no-files-found: warn
