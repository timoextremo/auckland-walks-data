name: Package all named Council tracks
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: all-named-council-tracks
          path: |
            source-data/auckland-council/TrackTrailCycleway/named
            source-data/auckland-council/TrackTrailCycleway/named-track-index.json
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/package-all-named-council.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-shot all-named packager' || exit 0
          git push
