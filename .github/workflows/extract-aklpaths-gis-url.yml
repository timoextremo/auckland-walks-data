name: Extract AKL Paths GIS URL
on:
  push:
    paths:
      - '.github/workflows/extract-aklpaths-gis-url.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract GIS URL and test map page
        run: |
          python - <<'PY'
          import requests,re,html,json
          from pathlib import Path
          base='https://www.aucklandcouncil.govt.nz'
          u=base+'/en/parks-recreation/get-outdoors/aklpaths/path-detail/305.html'
          raw=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          d=html.unescape(raw).replace('\\"','"').replace('\\/','/')
          out=[]
          for key in ['pathIdGISMapUrl','allPathsGISMapUrl']:
            pats=[rf'"{key}"\s*:\s*"([^"]+)"',rf'{key}[^:]*:\s*"([^"]+)"']
            vals=[]
            for p in pats:
              vals += re.findall(p,d)
            out.append(key+'='+json.dumps(sorted(set(vals))))
          # path-map page itself may contain resolved redirect/embed URL
          pm=base+'/en/parks-recreation/get-outdoors/aklpaths/path-map/305.html'
          r=requests.get(pm,headers={'User-Agent':'Mozilla/5.0'},timeout=30,allow_redirects=True)
          out.append(f'pathmap_status={r.status_code} final={r.url} len={len(r.text)}')
          dd=html.unescape(r.text).replace('\\"','"').replace('\\/','/')
          urls=sorted(set(re.findall(r'https?://[^"<> ]+',dd)))
          for x in urls:
            if any(k in x.lower() for k in ['arcgis','experience','map','gis','feature','service']): out.append('URL='+x[:3000])
          for kw in ['pathIdGISMapUrl','allPathsGISMapUrl','iframe','arcgis','experience','webmap','itemid','pathId']:
            poss=[m.start() for m in re.finditer(kw,dd,re.I)]
            out.append(f'{kw}_count={len(poss)}')
            for p in poss[:10]: out.append(re.sub(r'\s+',' ',dd[max(0,p-500):p+1400]))
          Path('source-data').mkdir(exist_ok=True)
          Path('source-data/aklpaths-gis-url.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit result and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-data/aklpaths-gis-url.txt
          git rm .github/workflows/extract-aklpaths-gis-url.yml
          git commit -m 'Extract AKL Paths GIS URL config'
          git push