name: Batch 2 historical route source reconciliation
on:
  pull_request:
    paths:
      - '.github/workflows/access-verification-batch2.yml'
      - 'scripts/oac_tracks_match.py'
      - 'scripts/te_araroa_route_match.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "prior-1"
            rows: "811,816,820,821,822"
          - name: "prior-2"
            rows: "827,830,831,833,836"
          - name: "prior-3"
            rows: "837,838,839,841,843"
          - name: "prior-4"
            rows: "846,847,849,851,855"
          - name: "prior-5"
            rows: "856,916,917,925,926"
          - name: "prior-6"
            rows: "928,931,932,935,936"
          - name: "prior-7"
            rows: "937,938,939,940,941"
          - name: "prior-8"
            rows: "943,944,945,946,985"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spatial dependencies
        run: python -m pip install --quiet "shapely>=2.0" "pyproj>=3.5" "requests>=2.31"
      - name: Herenga a Nuku production Auckland walking/shared/Te Araroa geometry
        run: python scripts/oac_tracks_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: Official 2026-27 Te Araroa GPS comparison
        run: python scripts/te_araroa_route_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "access-batch2-${{ matrix.name }}"
          path: |
            oac_match_*.json
            ta_match_*.json
          if-no-files-found: ignore
