name: Package AKL Paths routes
on:
  push:
    paths:
      - '.github/workflows/package-aklpaths-routes.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact route geometry
        run: |
          python - <<'PY'
          import requests,json,csv
          from pathlib import Path
          base='https://mapspublic.aklc.govt.nz/arcgis/rest/services/Applications/AucklandPaths/MapServer/9/query'
          p={'where':'1=1','outFields':'*','returnGeometry':'true','outSR':'4326','f':'geojson'}
          r=requests.get(base,params=p,timeout=120,headers={'User-Agent':'Mozilla/5.0'})
          r.raise_for_status()
          j=r.json()
          Path('artifact').mkdir(exist_ok=True)
          Path('artifact/aklpaths-routes.geojson').write_text(json.dumps(j),encoding='utf-8')
          rows=[]
          for f in j.get('features',[]):
            a=f.get('properties') or {}
            g=f.get('geometry') or {}
            rows.append({k:a.get(k) for k in ['OBJECTID','ItemID','Name','TypeA','TypeB','TravelTime','WalkingTime','CycleTime','PathStart','Visible','Distance','SHAPE_Length']})
          with open('artifact/aklpaths-routes.csv','w',newline='',encoding='utf-8') as fh:
            if rows:
              w=csv.DictWriter(fh,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          Path('artifact/status.json').write_text(json.dumps({'features':len(j.get('features',[])),'bytes':len(r.content)},indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aklpaths-exact-routes
          path: artifact/
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/package-aklpaths-routes.yml
          git commit -m 'Remove one-shot AKL Paths geometry packager'
          git push