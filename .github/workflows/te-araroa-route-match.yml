name: Te Araroa official GPX route verification
on:
  pull_request:
    paths:
      - 'scripts/te_araroa_route_match.py'
      - '.github/workflows/te-araroa-route-match.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "pilot-north"
            rows: "1320,1022,1023,1025,1354,1362"
          - name: "pilot-other"
            rows: "996,912,1196,994,1457,982"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spatial dependencies
        run: python -m pip install --quiet "shapely>=2.0" "pyproj>=3.5" "requests>=2.31"
      - name: Compare historic LINZ KML against official Te Araroa GPX
        run: python scripts/te_araroa_route_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "te-araroa-match-${{ matrix.name }}"
          path: ta_match_*.json
          if-no-files-found: ignore
