name: CRoSL state land overlap pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_crosl_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/crosl-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosl-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1065-1071"
            rows: "1065,1066,1067,1068,1069,1070,1071"
          - name: "1072-1078"
            rows: "1072,1073,1074,1075,1076,1077,1078"
          - name: "1079-1085"
            rows: "1079,1080,1081,1082,1083,1084,1085"
          - name: "1086-1092"
            rows: "1086,1087,1088,1089,1090,1091,1092"
          - name: "1093-1099"
            rows: "1093,1094,1095,1096,1097,1098,1099"
          - name: "1100-1106"
            rows: "1100,1101,1102,1103,1104,1105,1106"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect CRoSL polygons against LINZ walking tracks
        run: python scripts/land_access_crosl_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "crosl-${{ matrix.name }}"
          path: crosl-batch-*.json
          if-no-files-found: ignore
