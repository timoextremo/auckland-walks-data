name: CRoSL state land overlap pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_crosl_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/crosl-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosl-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1404-1410"
            rows: "1404,1405,1406,1407,1408,1409,1410"
          - name: "1411-1417"
            rows: "1411,1412,1413,1414,1415,1416,1417"
          - name: "1419-1425"
            rows: "1419,1420,1421,1422,1423,1424,1425"
          - name: "1426-1432"
            rows: "1426,1427,1428,1429,1430,1431,1432"
          - name: "1433-1439"
            rows: "1433,1434,1435,1436,1437,1438,1439"
          - name: "1440-1446"
            rows: "1440,1441,1442,1443,1444,1445,1446"
          - name: "1447-1453"
            rows: "1447,1448,1449,1450,1451,1452,1453"
          - name: "1454-1460"
            rows: "1454,1455,1456,1457,1458,1459,1460"
          - name: "1461-1467"
            rows: "1461,1462,1463,1464,1465,1466,1467"
          - name: "1468-1474"
            rows: "1468,1469,1470,1471,1472,1473,1474"
          - name: "1475-1481"
            rows: "1475,1476,1477,1478,1479,1480,1481"
          - name: "1482-1484"
            rows: "1482,1483,1484"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect CRoSL polygons against LINZ walking tracks
        run: python scripts/land_access_crosl_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "crosl-${{ matrix.name }}"
          path: crosl-batch-*.json
          if-no-files-found: ignore
