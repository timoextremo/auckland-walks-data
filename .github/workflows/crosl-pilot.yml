name: CRoSL state land overlap pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_crosl_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/crosl-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosl-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "896-902"
            rows: "896,897,898,899,900,901,902"
          - name: "903-909"
            rows: "903,904,905,906,907,908,909"
          - name: "910-916"
            rows: "910,911,912,913,914,915,916"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect CRoSL polygons against LINZ walking tracks
        run: python scripts/land_access_crosl_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "crosl-${{ matrix.name }}"
          path: crosl-batch-*.json
          if-no-files-found: ignore
