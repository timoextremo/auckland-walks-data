name: CRoSL state land overlap pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_crosl_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/crosl-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosl-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1191-1197"
            rows: "1191,1192,1193,1194,1195,1196,1197"
          - name: "1198-1204"
            rows: "1198,1199,1200,1201,1202,1203,1204"
          - name: "1205-1211"
            rows: "1205,1206,1207,1208,1209,1210,1211"
          - name: "1212-1218"
            rows: "1212,1213,1214,1215,1216,1217,1218"
          - name: "1219-1225"
            rows: "1219,1220,1221,1222,1223,1224,1225"
          - name: "1226-1232"
            rows: "1226,1227,1228,1229,1230,1231,1232"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect CRoSL polygons against LINZ walking tracks
        run: python scripts/land_access_crosl_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "crosl-${{ matrix.name }}"
          path: crosl-batch-*.json
          if-no-files-found: ignore
