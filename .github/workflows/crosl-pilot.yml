name: CRoSL state land overlap pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_crosl_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/crosl-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosl-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "980-987"
            rows: "980,982,983,984,985,986,987"
          - name: "988-994"
            rows: "988,989,990,991,992,993,994"
          - name: "995-1001"
            rows: "995,996,997,998,999,1000,1001"
          - name: "1002-1008"
            rows: "1002,1003,1004,1005,1006,1007,1008"
          - name: "1009-1015"
            rows: "1009,1010,1011,1012,1013,1014,1015"
          - name: "1016-1022"
            rows: "1016,1017,1018,1019,1020,1021,1022"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect CRoSL polygons against LINZ walking tracks
        run: python scripts/land_access_crosl_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "crosl-${{ matrix.name }}"
          path: crosl-batch-*.json
          if-no-files-found: ignore
