name: CRoSL state land overlap pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_crosl_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/crosl-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosl-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1107-1113"
            rows: "1107,1108,1109,1110,1111,1112,1113"
          - name: "1114-1120"
            rows: "1114,1115,1116,1117,1118,1119,1120"
          - name: "1121-1127"
            rows: "1121,1122,1123,1124,1125,1126,1127"
          - name: "1128-1134"
            rows: "1128,1129,1130,1131,1132,1133,1134"
          - name: "1135-1141"
            rows: "1135,1136,1137,1138,1139,1140,1141"
          - name: "1142-1148"
            rows: "1142,1143,1144,1145,1146,1147,1148"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect CRoSL polygons against LINZ walking tracks
        run: python scripts/land_access_crosl_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "crosl-${{ matrix.name }}"
          path: crosl-batch-*.json
          if-no-files-found: ignore
