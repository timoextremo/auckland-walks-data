name: CRoSL state land overlap pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_crosl_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/crosl-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosl-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1320-1326"
            rows: "1320,1321,1322,1323,1324,1325,1326"
          - name: "1327-1333"
            rows: "1327,1328,1329,1330,1331,1332,1333"
          - name: "1334-1340"
            rows: "1334,1335,1336,1337,1338,1339,1340"
          - name: "1341-1347"
            rows: "1341,1342,1343,1344,1345,1346,1347"
          - name: "1348-1354"
            rows: "1348,1349,1350,1351,1352,1353,1354"
          - name: "1355-1361"
            rows: "1355,1356,1357,1358,1359,1360,1361"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Intersect CRoSL polygons against LINZ walking tracks
        run: python scripts/land_access_crosl_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "crosl-${{ matrix.name }}"
          path: crosl-batch-*.json
          if-no-files-found: ignore
