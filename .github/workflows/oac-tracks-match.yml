name: Herenga tracks and trails route verification
on:
  pull_request:
    paths:
      - 'scripts/oac_tracks_match.py'
      - '.github/workflows/oac-tracks-match.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  track-match:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "land-forest"
            rows: "1320,1022,1354,1025"
          - name: "islands"
            rows: "996,912,1196,994"
          - name: "parks"
            rows: "1457,1023,982,1362"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet "shapely>=2.0" "pyproj>=3.5" "requests>=2.31"
      - name: Compare pilot KML lines to public OAC regional walking layers
        run: python scripts/oac_tracks_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "oac-tracks-${{ matrix.name }}"
          path: oac_match_*.json
          if-no-files-found: ignore
