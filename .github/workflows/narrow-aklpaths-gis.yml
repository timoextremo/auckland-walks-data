name: Narrow AKL Paths GIS
on:
  push:
    paths:
      - '.github/workflows/narrow-aklpaths-gis.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect path-detail JS only
        run: |
          python - <<'PY'
          import requests,re
          from pathlib import Path
          u='https://www.aucklandcouncil.govt.nz/_next/static/chunks/app/aklpaths/path-detail/%5Bid%5D/page-d2c384a15ca7be2d.js'
          t=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          out=[f'len={len(t)}']
          # all quoted constants with map/gis/api/path-ish words
          strings=[]
          for m in re.finditer(r'(["\'])(.*?)(?<!\\)\1',t):
            s=m.group(2)
            if any(k in s.lower() for k in ['gis','map','arcgis','api','path','route','feature','shape','geometry']):
              strings.append(s)
          out.append('=== STRINGS ===')
          for s in sorted(set(strings)):
            out.append(s[:2500])
          # targeted snippets around likely request mechanics and showGis
          out.append('=== SNIPPETS ===')
          for kw in ['showGis','fetch(','axios','.get(','/api/','pathId','FeatureServer','MapServer','arcgis','gis','lightbox-map','map-card','mapThumbnail']:
            pos=[m.start() for m in re.finditer(re.escape(kw),t,re.I)]
            out.append(f'## {kw} count={len(pos)}')
            for p in pos[:30]:
              out.append(re.sub(r'\s+',' ',t[max(0,p-800):p+2200]))
          Path('source-data').mkdir(exist_ok=True)
          Path('source-data/aklpaths-gis-narrow.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit result and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-data/aklpaths-gis-narrow.txt
          git rm .github/workflows/narrow-aklpaths-gis.yml
          git commit -m 'Narrow AKL Paths GIS request inspection'
          git push