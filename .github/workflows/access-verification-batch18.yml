name: Batch 18 final thirty-five short LINZ walking tracks
on:
  pull_request:
    paths:
      - '.github/workflows/access-verification-batch18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: "short18-1"
            rows: "1253,1281,1020,974"
          - name: "short18-2"
            rows: "1407,1267,891,965"
          - name: "short18-3"
            rows: "1292,1114,910,908"
          - name: "short18-4"
            rows: "1269,1148,1097,898"
          - name: "short18-5"
            rows: "1297,1256,977,1429"
          - name: "short18-6"
            rows: "1112,1121,1303,961"
          - name: "short18-7"
            rows: "1183,1086,986,906"
          - name: "short18-8"
            rows: "950,1177,1447,1324"
          - name: "short18-9"
            rows: "1176,1091,880"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only GIS dependencies
        run: python -m pip install --quiet "shapely>=2.0" "pyproj>=3.5" "requests>=2.31"
      - name: Exact historic LINZ KML geometry and bounding box
        run: python scripts/historic_kml_metadata.py --rows "${{ matrix.rows }}"
      - name: Herenga a Nuku published walking/shared use paths
        run: python scripts/oac_tracks_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: DOC published walking-experience GIS
        run: python scripts/doc_open_track_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: Official 2026-27 Te Araroa GPS matching
        run: python scripts/te_araroa_route_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: Community-mapped path / name clues (not proof of access)
        continue-on-error: true
        run: python scripts/osm_small_bbox_check.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "access-batch18-${{ matrix.name }}"
          path: |
            oac_match_*.json
            ta_match_*.json
            local_osm_*.json
          if-no-files-found: ignore
