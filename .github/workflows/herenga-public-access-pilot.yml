name: Herenga a Nuku public access pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_herenga_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/herenga-public-access-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-access-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "854-860"
            rows: "854,855,856,857,858,859,860"
          - name: "861-867"
            rows: "861,862,863,864,865,866,867"
          - name: "868-874"
            rows: "868,869,870,871,872,873,874"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Spatial overlay of all six WAMS access classes
        run: python scripts/land_access_herenga_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "wams-${{ matrix.name }}"
          path: wams-batch-*.json
          if-no-files-found: ignore
