name: Herenga a Nuku public access pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_herenga_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/herenga-public-access-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-access-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1149-1155"
            rows: "1149,1150,1151,1152,1153,1154,1155"
          - name: "1156-1162"
            rows: "1156,1157,1158,1159,1160,1161,1162"
          - name: "1163-1169"
            rows: "1163,1164,1165,1166,1167,1168,1169"
          - name: "1170-1176"
            rows: "1170,1171,1172,1173,1174,1175,1176"
          - name: "1177-1183"
            rows: "1177,1178,1179,1180,1181,1182,1183"
          - name: "1184-1190"
            rows: "1184,1185,1186,1187,1188,1189,1190"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Spatial overlay of all six WAMS access classes
        run: python scripts/land_access_herenga_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "wams-${{ matrix.name }}"
          path: wams-batch-*.json
          if-no-files-found: ignore
