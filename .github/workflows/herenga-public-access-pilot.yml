name: Herenga a Nuku public access pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_herenga_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/herenga-public-access-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-access-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1023-1029"
            rows: "1023,1024,1025,1026,1027,1028,1029"
          - name: "1030-1036"
            rows: "1030,1031,1032,1033,1034,1035,1036"
          - name: "1037-1043"
            rows: "1037,1038,1039,1040,1041,1042,1043"
          - name: "1044-1050"
            rows: "1044,1045,1046,1047,1048,1049,1050"
          - name: "1051-1057"
            rows: "1051,1052,1053,1054,1055,1056,1057"
          - name: "1058-1064"
            rows: "1058,1059,1060,1061,1062,1063,1064"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Spatial overlay of all six WAMS access classes
        run: python scripts/land_access_herenga_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "wams-${{ matrix.name }}"
          path: wams-batch-*.json
          if-no-files-found: ignore
