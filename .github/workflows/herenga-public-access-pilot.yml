name: Herenga a Nuku public access pilot
on:
  pull_request:
    paths:
      - 'scripts/land_access_herenga_pilot.py'
      - 'scripts/land_access_primary_parcels.py'
      - '.github/workflows/herenga-public-access-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-access-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1275-1281"
            rows: "1275,1276,1277,1278,1279,1280,1281"
          - name: "1282-1288"
            rows: "1282,1283,1284,1285,1286,1287,1288"
          - name: "1289-1295"
            rows: "1289,1290,1291,1292,1293,1294,1295"
          - name: "1296-1302"
            rows: "1296,1297,1298,1299,1300,1301,1302"
          - name: "1303-1309"
            rows: "1303,1304,1305,1306,1307,1308,1309"
          - name: "1310-1319"
            rows: "1310,1311,1315,1316,1317,1318,1319"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS dependencies
        run: python -m pip install --quiet shapely>=2.0 pyproj>=3.5 requests>=2.31
      - name: Spatial overlay of all six WAMS access classes
        run: python scripts/land_access_herenga_pilot.py --rows "${{ matrix.rows }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "wams-${{ matrix.name }}"
          path: wams-batch-*.json
          if-no-files-found: ignore
