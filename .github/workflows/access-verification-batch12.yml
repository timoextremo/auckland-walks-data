name: Batch 12 next forty short LINZ walking tracks
on:
  pull_request:
    paths:
      - '.github/workflows/access-verification-batch12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: "short12-1"
            rows: "1274,1399,1279,1280"
          - name: "short12-2"
            rows: "921,970,892,893"
          - name: "short12-3"
            rows: "894,1282,1453,895"
          - name: "short12-4"
            rows: "896,1283,1157,1190"
          - name: "short12-5"
            rows: "1285,1286,1307,1158"
          - name: "short12-6"
            rows: "1287,1288,1289,1403"
          - name: "short12-7"
            rows: "975,984,1163,1294"
          - name: "short12-8"
            rows: "1405,922,1167,1299"
          - name: "short12-9"
            rows: "907,911,901,1098"
          - name: "short12-10"
            rows: "885,1396,858,1133"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only GIS dependencies
        run: python -m pip install --quiet "shapely>=2.0" "pyproj>=3.5" "requests>=2.31"
      - name: Exact historic LINZ KML geometry and bounding box
        run: python scripts/historic_kml_metadata.py --rows "${{ matrix.rows }}"
      - name: Herenga a Nuku published walking/shared use paths
        run: python scripts/oac_tracks_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: DOC published walking-experience GIS
        run: python scripts/doc_open_track_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: Official 2026-27 Te Araroa GPS matching
        run: python scripts/te_araroa_route_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: Community-mapped path / name clues (not proof of access)
        continue-on-error: true
        run: python scripts/osm_small_bbox_check.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "access-batch12-${{ matrix.name }}"
          path: |
            oac_match_*.json
            ta_match_*.json
            local_osm_*.json
          if-no-files-found: ignore
