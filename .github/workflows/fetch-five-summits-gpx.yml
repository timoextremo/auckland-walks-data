name: Fetch Five Summits GPX

on:
  push:
    paths:
      - '.github/workflows/fetch-five-summits-gpx.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download published Five Summits GPX
        run: |
          curl -fL --retry 3 'https://www.wildernessmag.co.nz/wp-content/uploads/2025/10/Pukehohe-5-Summits.gpx' -o five-summits.gpx
          test -s five-summits.gpx
      - name: Upload GPX
        uses: actions/upload-artifact@v4
        with:
          name: pukekohe-five-summits-gpx
          path: five-summits.gpx
          retention-days: 1
