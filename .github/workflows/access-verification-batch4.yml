name: Batch 4 Auckland public-access route comparison
on:
  pull_request:
    paths:
      - '.github/workflows/access-verification-batch4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: "fourth-1"
            rows: "1186,1187,1193,1200"
          - name: "fourth-2"
            rows: "1201,1206,1207,1209"
          - name: "fourth-3"
            rows: "1212,1214,1215,1216"
          - name: "fourth-4"
            rows: "1217,1220,1228,1233"
          - name: "fourth-5"
            rows: "1234,1235,1302,1309"
          - name: "fourth-6"
            rows: "1310,1317,1318,1319"
          - name: "fourth-7"
            rows: "1326,1329,1334,1336"
          - name: "fourth-8"
            rows: "1338,1342,1358,1359"
          - name: "fourth-9"
            rows: "1360,1363,1364,1365"
          - name: "fourth-10"
            rows: "1368,1369,1372,1376"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only GIS analysis dependencies
        run: python -m pip install --quiet "shapely>=2.0" "pyproj>=3.5" "requests>=2.31"
      - name: Herenga a Nuku published Auckland track lines
        run: python scripts/oac_tracks_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: Official DOC walking-experience route lines
        run: python scripts/doc_open_track_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: Official 2026-27 Te Araroa GPS
        run: python scripts/te_araroa_route_match.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - name: Volunteer footpath matching and named ways (not access certification)
        continue-on-error: true
        run: python scripts/osm_small_bbox_check.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "access-batch4-${{ matrix.name }}"
          path: |
            oac_match_*.json
            ta_match_*.json
            local_osm_*.json
          if-no-files-found: ignore
