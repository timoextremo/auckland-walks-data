name: Long-first pedestrian corridor audit (16 named paths)
on:
  pull_request:
    paths:
      - '.github/workflows/access-long-first-16.yml'
      - 'scripts/access_endpoint_l2.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: long-01
            rows: '1206,926,1179,1358'
          - name: long-02
            rows: '1466,928,1459,1209'
          - name: long-03
            rows: '1028,1186,1214,1334'
          - name: long-04
            rows: '1363,1364,1216,1372'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet "shapely>=2.0" "pyproj>=3.5" "requests>=2.31"
      - name: Compare historical long-track endpoints, named reserve parcels and restricted paths
        run: python scripts/access_endpoint_l2.py --rows "${{ matrix.rows }}" --name "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "long-first-l2-${{ matrix.name }}"
          path: "endpoint_l2_*.json"
          if-no-files-found: warn
